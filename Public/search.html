<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar | K'FE Confecciones</title>
  <meta name="description" content="Resultados de búsqueda en el catálogo de K'FE Confecciones.">
  <meta name="theme-color" content="#2B1B14">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="buscar">
  <div data-cabecera></div>
  <main>
    <section class="pagina-hero">
      <div class="contenedor">
        <p class="migas"><a href="index.html">Inicio</a> / Búsqueda</p>
        <span class="eyebrow">Resultados para</span>
        <h1 id="titulo-busqueda">Todo el catálogo</h1>
      </div>
    </section>
    <section class="seccion" style="padding-top:40px">
      <div class="contenedor">
        <div class="barra-filtros">
          <div class="chips" id="chips"></div>
          <label class="orden">Ordenar
            <select id="orden">
              <option value="destacados">Más pedidos</option>
              <option value="menor">Menor precio</option>
              <option value="mayor">Mayor precio</option>
            </select>
          </label>
        </div>
        <p class="contador" id="contador"></p>
        <div class="grid-productos" id="grid-productos"></div>
        <div data-nota-compra></div>
      </div>
    </section>
  </main>
  <div data-pie></div>
  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
